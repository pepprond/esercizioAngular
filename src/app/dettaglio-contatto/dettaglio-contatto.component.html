<div *ngIf="contatto">
  <mat-card class="dettaglio-card">
    <mat-card-title>Dettaglio Contatto</mat-card-title>
    <mat-divider></mat-divider>

    <mat-card-content>
      <p><strong>Nome:</strong> {{ contatto.name }}</p>
      <p><strong>Email:</strong> {{ contatto.email }}</p>
      <p><strong>Indirizzo:</strong> {{ contatto.address }}</p>
    </mat-card-content>
  </mat-card>
</div>
