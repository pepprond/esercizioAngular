<mat-form-field onsubmit="cerca(event)">
  <input
    matInput
    class="form-control me-2"
    type="search"
    placeholder="Cerca..."
    aria-label="Search"
    (keyup)="cercaContatto($event)"
  />
</mat-form-field>

<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let contact of contactListfiltrata">
    <app-contact-card
      [contact]="contact"
      (delete)="deleteContactSelected($event)"
    ></app-contact-card>
  </div>
</div>
